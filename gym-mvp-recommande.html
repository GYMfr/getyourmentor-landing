  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #gym-flow-demo .screen{padding:18px;display:grid;align-content:start;gap:14px}#gym-flow-demo .lead{display:grid;gap:5px}#gym-flow-demo .lead h3,#gym-flow-demo .lead p{margin:0}#gym-flow-demo .lead p{color:var(--muted-foreground)}#gym-flow-demo .box{padding:14px;background:var(--orange-soft);border-radius:12px;display:grid;gap:9px}#gym-flow-demo .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}#gym-flow-demo .row:last-child{border-bottom:0}#gym-flow-demo .row-main strong,#gym-flow-demo .row-main span{display:block}#gym-flow-demo .row-main span{color:var(--muted-foreground)}
    #gym-flow-demo .field{display:grid;gap:5px}#gym-flow-demo .field span{color:var(--muted-foreground)}#gym-flow-demo .checks{display:grid;gap:8px}#gym-flow-demo .check{display:flex;align-items:flex-start;gap:8px}#gym-flow-demo .check i{color:var(--orange);flex:0 0 auto}#gym-flow-demo .actions{display:grid;gap:8px}#gym-flow-demo .actions .btn{justify-content:center}#gym-flow-demo .next{box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 28%,transparent)}#gym-flow-demo .code{text-align:center;padding:16px;background:var(--orange-soft);color:var(--orange-ink);border-radius:12px;font-weight:500;letter-spacing:.08em}
    #gym-flow-demo .foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted-foreground)}#gym-flow-demo .v1{opacity:.48}#gym-flow-demo .v1-list{display:grid;gap:7px}#gym-flow-demo .v1-item{padding:9px;border:1px dashed var(--border);color:var(--muted-foreground);border-radius:9px}#gym-flow-demo .event{padding:10px 0;border-bottom:1px solid var(--border)}#gym-flow-demo .event:last-child{border-bottom:0}#gym-flow-demo .event strong,#gym-flow-demo .event span{display:block}#gym-flow-demo .event span{color:var(--muted-foreground)}#gym-flow-demo .reset{justify-self:center}

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
