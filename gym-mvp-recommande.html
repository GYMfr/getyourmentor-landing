  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;gym-app-demo&quot;&gt;
  &lt;style&gt;
    #gym-app-demo {

      --primary-foreground: light-dark(#ffffff, #251006);

      --accent-foreground: var(--gym-orange-ink);

      display: grid;
      gap: 16px;

    #gym-app-demo .gym-role-switch { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #gym-app-demo .gym-role-switch .btn { display: inline-flex; align-items: center; gap: 7px; }
    #gym-app-demo .gym-demo-meta { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; color: var(--muted-foreground); }
    #gym-app-demo .gym-demo-meta span { display: inline-flex; align-items: center; gap: 6px; }
    #gym-app-demo .gym-scope-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #gym-app-demo .gym-scope-part { padding: 12px; display: grid; gap: 3px; border-radius: 12px; }
    #gym-app-demo .gym-scope-part strong { display: flex; align-items: center; gap: 7px; }
    #gym-app-demo .gym-scope-part.mvp { background: var(--gym-orange-soft); color: var(--gym-orange-ink); border: 1px solid color-mix(in srgb, var(--gym-orange) 42%, transparent); }
    #gym-app-demo .gym-scope-part.v1 { background: var(--muted); color: var(--muted-foreground); border: 1px solid var(--border); }
    #gym-app-demo .gym-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    #gym-app-demo .gym-dot.mvp { background: var(--gym-orange); }
    #gym-app-demo .gym-dot.v1 { background: var(--muted-foreground); }
    #gym-app-demo .gym-stage { display: grid; justify-items: center; }
    #gym-app-demo .gym-device {
      width: min(100%, 390px);
      min-height: 650px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      color: var(--card-foreground);
      box-shadow: 0 18px 52px color-mix(in srgb, var(--gym-orange) 16%, transparent);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(500px, 1fr) auto;
    }
    #gym-app-demo .gym-device.desktop { width: min(100%, 700px); border-radius: 16px; }
    #gym-app-demo .gym-appbar {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--card) 94%, var(--gym-orange));
    }
    #gym-app-demo .gym-back { visibility: hidden; }
    #gym-app-demo .gym-back.is-visible { visibility: visible; }
    #gym-app-demo .gym-app-title { min-width: 0; }
    #gym-app-demo .gym-app-title strong, #gym-app-demo .gym-app-title span { display: block; }
    #gym-app-demo .gym-app-title span { color: var(--muted-foreground); }
    #gym-app-demo .gym-phase { white-space: nowrap; }
    #gym-app-demo .gym-phase.mvp { background: var(--gym-orange-soft); color: var(--gym-orange-ink); }
    #gym-app-demo .gym-phase.v1 { background: var(--muted); color: var(--muted-foreground); }
    #gym-app-demo .gym-screen { padding: 18px; display: grid; align-content: start; gap: 15px; }
    #gym-app-demo .gym-screen.is-v1 { background: color-mix(in srgb, var(--muted) 34%, var(--card)); }
    #gym-app-demo .gym-lead { display: grid; gap: 6px; }
    #gym-app-demo .gym-lead h3, #gym-app-demo .gym-lead p { margin: 0; }
    #gym-app-demo .gym-lead p { color: var(--muted-foreground); }
    #gym-app-demo .gym-search-box { display: grid; gap: 10px; padding: 14px; background: var(--gym-orange-soft); border-radius: 14px; }
    #gym-app-demo .gym-field { display: grid; gap: 5px; }
    #gym-app-demo .gym-field-label { color: var(--muted-foreground); }
    #gym-app-demo .gym-field-value { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 9px; }
    #gym-app-demo .gym-list { display: grid; gap: 10px; }
    #gym-app-demo .gym-item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    #gym-app-demo .gym-item:last-child { border-bottom: 0; }
    #gym-app-demo .gym-avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--gym-orange-soft); color: var(--gym-orange-ink); }
    #gym-app-demo .gym-item-main strong, #gym-app-demo .gym-item-main span { display: block; }
    #gym-app-demo .gym-item-main span { color: var(--muted-foreground); }
    #gym-app-demo .gym-price { font-weight: 500; }
    #gym-app-demo .gym-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    #gym-app-demo .gym-choice { width: 100%; min-height: 64px; display: grid; align-content: center; justify-items: start; text-align: left; }
    #gym-app-demo .gym-choice small { color: var(--muted-foreground); }
    #gym-app-demo .gym-choice.future { opacity: .56; }
    #gym-app-demo .gym-summary { padding: 14px; border-left: 4px solid var(--gym-orange); background: var(--gym-orange-soft); display: grid; gap: 8px; }
    #gym-app-demo .gym-summary-row { display: flex; justify-content: space-between; gap: 12px; }
    #gym-app-demo .gym-code { text-align: center; padding: 16px; background: var(--gym-orange-soft); color: var(--gym-orange-ink); font-weight: 500; letter-spacing: .08em; border-radius: 12px; }
    #gym-app-demo .gym-checks { display: grid; gap: 9px; }
    #gym-app-demo .gym-check { display: flex; align-items: flex-start; gap: 9px; }
    #gym-app-demo .gym-check i { color: var(--gym-orange); flex: 0 0 auto; }
    #gym-app-demo .gym-actions { display: grid; gap: 8px; margin-top: 2px; }
    #gym-app-demo .gym-actions .btn { justify-content: center; }
    #gym-app-demo .gym-actions .future-action { opacity: .56; }
    #gym-app-demo .gym-v1-notice { padding: 12px; border: 1px dashed var(--muted-foreground); color: var(--muted-foreground); border-radius: 10px; }
    #gym-app-demo .gym-bottom-nav { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); }
    #gym-app-demo .gym-nav-btn { border: 0; background: transparent; color: var(--muted-foreground); padding: 12px 6px; display: grid; justify-items: center; gap: 3px; cursor: pointer; }
    #gym-app-demo .gym-nav-btn.is-active { color: var(--gym-orange); }
    #gym-app-demo .gym-nav-btn.future { opacity: .48; }
    #gym-app-demo .gym-toast { min-height: 24px; text-align: center; color: var(--gym-orange-ink); }
    @media (max-width: 520px) {
      #gym-app-demo .gym-device, #gym-app-demo .gym-device.desktop { min-height: 610px; border-radius: 20px; }
      #gym-app-demo .gym-screen { padding: 14px; }
      #gym-app-demo .gym-grid { grid-template-columns: 1fr; }
      #gym-app-demo .gym-phase { display: none; }
      #gym-app-demo .gym-appbar { grid-template-columns: 38px 1fr; }
      #gym-app-demo .gym-scope-strip { grid-template-columns: 1fr; }
    }

      function go(target, push = true) {

        current = target;

      }

      back.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!history.length) return;
        current = history.pop();
        render();
      });

      root.querySelectorAll(&#x27;[data-role]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        role = button.dataset.role;
        history = [];
        current = apps[role].home;
        root.querySelectorAll(&#x27;[data-role]&#x27;).forEach(tab =&gt; {
          const selected = tab === button;
          tab.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          tab.classList.toggle(&#x27;btn-primary&#x27;, selected);

        render();
      }));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
